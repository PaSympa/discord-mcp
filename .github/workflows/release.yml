name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run bundle
      - run: node scripts/check-bundle.mjs discord-mcp.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: mcpb
          path: discord-mcp.mcpb
          if-no-files-found: error

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build-mcpb]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 22 does not ship.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json, server.json, manifest.json and plugin.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SRV_VERSION="$(node -p "require('./server.json').version")"
          MCPB_VERSION="$(node -p "require('./manifest.json').version")"
          PLUGIN_VERSION="$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$SRV_VERSION" ] || [ "$TAG_VERSION" != "$MCPB_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION server.json=$SRV_VERSION manifest.json=$MCPB_VERSION plugin.json=$PLUGIN_VERSION"
            exit 1
          fi
          node -e '
            const tag = process.argv[1];
            for (const pkg of require("./server.json").packages ?? []) {
              const v = pkg.registryType === "oci" ? pkg.identifier.split(":").pop() : pkg.version;
              if (v !== tag) {
                console.error(`Version mismatch in server.json package ${pkg.identifier}: ${v} != ${tag}`);
                process.exit(1);
              }
            }
            const { name } = require("./package.json");
            for (const [server, { args }] of Object.entries(require("./plugin/.claude-plugin/plugin.json").mcpServers)) {
              if (!args.includes(`${name}@${tag}`)) {
                console.error(`Version mismatch in plugin.json server ${server}: ${args.join(" ")} does not run ${name}@${tag}`);
                process.exit(1);
              }
            }
          ' "$TAG_VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-docker, github-release]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Hashes the public release asset, never the build artifact: a full rerun rebuilds a
      # bundle with another sha256 (zip mtimes), while the release keeps the first upload.
      - name: Add the bundle from the GitHub Release to server.json
        run: node scripts/registry-mcpb.mjs "${GITHUB_REF#refs/tags/v}" > "$RUNNER_TEMP/server.json"
      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz"
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate "$RUNNER_TEMP/server.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish "$RUNNER_TEMP/server.json"

  publish-docker:
    runs-on: ubuntu-latest
    needs: [publish-npm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            pasympa/discord-mcp:${{ steps.version.outputs.VERSION }}
            pasympa/discord-mcp:latest

  github-release:
    runs-on: ubuntu-latest
    needs: [build-mcpb, publish-npm, publish-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mcpb
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: discord-mcp.mcpb
          fail_on_unmatched_files: true
          # The immutable registry entry records this asset's sha256: a rerun must not replace it.
          overwrite_files: false
